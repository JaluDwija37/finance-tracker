services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    restart: "no"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
      - dev_next_cache:/app/.next
      - dev_pnpm_store:/pnpm/store
    command: ["sh", "scripts/dev-entrypoint.sh"]

volumes:
  dev_node_modules:
  dev_next_cache:
  dev_pnpm_store:
